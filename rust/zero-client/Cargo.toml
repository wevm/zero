[package]
name = "zero-client"
version.workspace = true
description = "A native Rust client for Zero."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["zero", "sync", "local-first", "ivm"]
categories = ["database", "web-programming::websocket"]

# The end-to-end tests' WebSocket client. Which transport the client ships
# is decided with the engine (M4).
[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
] }

[lints]
workspace = true
