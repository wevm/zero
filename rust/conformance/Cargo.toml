[package]
name = "zero-conformance"
version.workspace = true
description = "Replays the JS client's conformance vectors (packages/zero-conformance) against zero-client."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The client scenarios run on SQLite storage too; bundled, so the runner
# needs no system `libsqlite3`.
[dependencies]
zero-client = { workspace = true, features = ["sqlite-bundled"] }

