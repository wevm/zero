name: Swift Mirror

# Publishes swift/ to the SwiftPM mirror (wevm/zero-swift) and tags the version
# in swift/VERSION. SwiftPM needs Package.swift at a repository root and clones
# whole repositories, so consumers install from the mirror, not this monorepo.
#
# The swift-release environment requires approval, and the job is skipped
# until the ZERO_SWIFT_MIRROR_TOKEN secret (push access to the mirror) exists.

on:
  push:
    branches: [main]
    paths: ['swift/VERSION']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Publish mirror
    runs-on: ubuntu-latest
    environment: swift-release
    env:
      MIRROR_TOKEN: ${{ secrets.ZERO_SWIFT_MIRROR_TOKEN }}
      MIRROR_REPO: wevm/zero-swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Split and push
        if: env.MIRROR_TOKEN != ''
        run: |
          version="$(tr -d '[:space:]' < swift/VERSION)"
          git subtree split --prefix=swift -b mirror
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git"
          git push "$remote" mirror:main
          if git ls-remote --exit-code --tags "$remote" "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists on the mirror; not retagging."
          else
            git tag "$version" mirror
            git push "$remote" "refs/tags/$version"
          fi
