name: zbugs Rune

# apps/zbugs-rune: zbugs on the Zero Rust client with the Rune UI framework.
# Path-filtered because macOS runners are slow to start. macOS runs the app
# end to end; Linux checks that it builds, passes its tests, and renders.

on:
  push:
    branches: [main]
    paths:
      - 'apps/zbugs-swift/server/**'
      - 'apps/zbugs-rune/**'
      - 'apps/zbugs-model/**'
      - 'rust/zero-client/**'
      - '.github/workflows/zbugs-rune.yml'
  # Any base, so a PR stacked on another one gets checked too.
  pull_request:
    paths:
      - 'apps/zbugs-swift/server/**'
      - 'apps/zbugs-rune/**'
      - 'apps/zbugs-model/**'
      - 'rust/zero-client/**'
      - '.github/workflows/zbugs-rune.yml'

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  app:
    name: zbugs Rune app (macOS)
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/zbugs-rune
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # rustup is preinstalled; rust-toolchain.toml picks the version.
      - name: Install the toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/zbugs-rune/target
          key: zbugs-rune-${{ runner.os }}-${{ hashFiles('apps/zbugs-rune/Cargo.lock', 'apps/zbugs-rune/rust-toolchain.toml') }}
          restore-keys: zbugs-rune-${{ runner.os }}-
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      # Headless, with no backend: the app renders its first frame with
      # Rune's own renderer, as a window would.
      - name: Render headless
        env:
          ZBUGS_RUNE_DIR: ${{ runner.temp }}/zbugs-rune
        run: |
          cargo run --locked -- --snap "$RUNNER_TEMP/zbugs-rune.png" --size 1180x760
          test -s "$RUNNER_TEMP/zbugs-rune.png"
      # End to end: zbugs' backend (Postgres, zero-cache, and the API), and
      # the app headless on the wall clock against it (e2e.sh).
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
      # zero-cache runs from source, which needs Node 24 (`using`).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Install the backend
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Start Postgres
        run: |
          brew install postgresql@17
          bin="$(brew --prefix postgresql@17)/bin"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/initdb" -D "$RUNNER_TEMP/pg" -U postgres --auth=trust
          echo "wal_level = logical" >> "$RUNNER_TEMP/pg/postgresql.conf"
          "$bin/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -o "-p 5432 -k /tmp" -w start
      - name: Start the backend
        working-directory: .
        env:
          ZBUGS_PG: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          node apps/zbugs-swift/server/server.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 180); do
            if grep -q '^ready ' "$RUNNER_TEMP/server.log"; then
              echo "ZBUGS_TOKEN=$(grep '^token ' "$RUNNER_TEMP/server.log" | cut -d' ' -f2)" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - name: End to end
        env:
          ZBUGS_DB_URL: postgresql://postgres@127.0.0.1:5432/zbugs_swift
          ZBUGS_E2E_SNAP: ${{ runner.temp }}/zbugs-rune-e2e.png
        run: ./e2e.sh
      - name: Backend log
        if: failure()
        run: tail -100 "$RUNNER_TEMP/server.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zbugs-rune-snapshot
          path: |
            ${{ runner.temp }}/zbugs-rune.png
            ${{ runner.temp }}/zbugs-rune-e2e.png
          if-no-files-found: ignore

  linux:
    name: zbugs Rune app (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/zbugs-rune
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Rune's windowing libraries, and a software Vulkan driver for its
      # headless renderer on a runner without a GPU.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      - name: Install the toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/zbugs-rune/target
          key: zbugs-rune-${{ runner.os }}-${{ hashFiles('apps/zbugs-rune/Cargo.lock', 'apps/zbugs-rune/rust-toolchain.toml') }}
          restore-keys: zbugs-rune-${{ runner.os }}-
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Render headless
        env:
          ZBUGS_RUNE_DIR: ${{ runner.temp }}/zbugs-rune
        run: |
          cargo run --locked -- --snap "$RUNNER_TEMP/zbugs-rune-linux.png" --size 1180x760
          test -s "$RUNNER_TEMP/zbugs-rune-linux.png"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zbugs-rune-linux-snapshot
          path: ${{ runner.temp }}/zbugs-rune-linux.png
          if-no-files-found: ignore
