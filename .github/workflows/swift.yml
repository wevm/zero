name: Swift

# CI for the Swift client in swift/ and the conformance vectors it replays
# (packages/zero-conformance). Linux runs on every change because the vectors
# can go stale from any JS change. The Apple-only layer runs in swift-macos.yml.

on:
  push:
    # swift-client is the development branch until the client lands on main.
    branches: [main, swift-client]
  pull_request:
    branches: [main]

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  vectors:
    name: Conformance Vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Fails when the checked-in vectors no longer match the JS behavior.
      - name: Check vectors are current
        run: pnpm --filter zero-conformance run test

  linux:
    name: Swift (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2.4-bookworm
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install system libraries
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Format
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
