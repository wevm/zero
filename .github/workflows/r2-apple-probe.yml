name: r2 Apple probe (temporary)

# DO NOT MERGE: runs the end-to-end tests on macOS with URLSessionTransport against a real zero-cache, the transport probes, and the app lifecycle tests.

on:
  pull_request:
    branches: [main]

concurrency:
  group: 'r2-apple-probe @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'r2-apple'
    name: r2 Apple probe (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres
        run: |
          brew install postgresql@17
          bin="$(brew --prefix postgresql@17)/bin"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/initdb" -D "$RUNNER_TEMP/pg" -U postgres --auth=trust > /dev/null
          "$bin/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -o "-c wal_level=logical -c max_connections=200" start
          until "$bin/pg_isready" -q -h 127.0.0.1; do sleep 1; done
      - run: swift --version
      - name: Build
        working-directory: swift
        run: swift build --build-tests
      - name: Transport probes (no server)
        id: probes
        continue-on-error: true
        working-directory: swift
        run: swift test --skip-build --filter TransportProbeTests 2>&1 | tee "$RUNNER_TEMP/probes.log"; exit "${PIPESTATUS[0]}"
      - name: Start zero-cache
        env:
          ZERO_E2E_PG: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          node packages/zero-conformance/src/e2e/server.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 180); do
            grep -q '^ready ' "$RUNNER_TEMP/server.log" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - name: E2E tests with URLSessionTransport
        id: e2e
        continue-on-error: true
        working-directory: swift
        env:
          ZERO_E2E_URL: ws://127.0.0.1:4848
        run: swift test --skip-build --filter 'WalkingSkeletonTests|ClientE2ETests|HardenE2ETests' 2>&1 | tee "$RUNNER_TEMP/e2e-urlsession.log"; exit "${PIPESTATUS[0]}"
      - name: App lifecycle tests (macOS)
        id: lifecycle
        continue-on-error: true
        working-directory: swift
        env:
          ZERO_LIFECYCLE_TESTS: '1'
        run: swift test --skip-build --filter AppLifecycleTests 2>&1 | tee "$RUNNER_TEMP/lifecycle-macos.log"; exit "${PIPESTATUS[0]}"
      - name: App lifecycle tests (iOS Simulator)
        id: lifecycle-ios
        continue-on-error: true
        working-directory: swift
        env:
          TEST_RUNNER_ZERO_LIFECYCLE_TESTS: '1'
        run: |
          device="$(xcrun simctl list devices available -j |
            python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')"
          xcodebuild test -scheme Zero-Package -destination "id=$device" -skipPackagePluginValidation \
            -only-testing:AppleTests/AppLifecycleTests 2>&1 | tee "$RUNNER_TEMP/lifecycle-ios.log" | grep -E '(✔|✘|◇|\[lifecycle\]|error:|Expectation|recorded an issue|TEST (SUCCEEDED|FAILED))'
          exit "${PIPESTATUS[0]}"
      - name: Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-apple-probe-logs
          path: |
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
      - name: Outcome
        if: always()
        run: |
          echo "probes=${{ steps.probes.outcome }} e2e=${{ steps.e2e.outcome }} lifecycle=${{ steps.lifecycle.outcome }} lifecycle-ios=${{ steps.lifecycle-ios.outcome }}"
          test "${{ steps.probes.outcome }}" = success -a "${{ steps.e2e.outcome }}" = success -a "${{ steps.lifecycle.outcome }}" = success -a "${{ steps.lifecycle-ios.outcome }}" = success
