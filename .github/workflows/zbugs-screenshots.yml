name: zbugs screenshots

# Runs the Swift zbugs app in the iOS Simulator against zbugs' backend
# (apps/zbugs-swift/server/server.ts) and keeps a screenshot of each screen
# (apps/zbugs-swift/App/UITests) as the zbugs-screenshots artifact.
# Path-filtered to the app and the UI layer: macOS runners are slow to start.

on:
  push:
    branches: [main, swift-client]
    paths:
      - 'apps/zbugs-swift/**'
      - 'swift/Sources/ZeroUI/**'
      - '.github/workflows/zbugs-screenshots.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/zbugs-swift/**'
      - 'swift/Sources/ZeroUI/**'
      - '.github/workflows/zbugs-screenshots.yml'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    name: zbugs screenshots (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
      # zero-cache runs from source, which needs Node 24 (`using`).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres
        run: |
          brew install postgresql@17
          pg="$(brew --prefix postgresql@17)/bin"
          echo "$pg" >> "$GITHUB_PATH"
          "$pg/initdb" -D "$RUNNER_TEMP/pg" -U postgres --auth=trust
          "$pg/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" \
            -o "-c wal_level=logical -p 5432" start
          until "$pg/pg_isready" -q -h 127.0.0.1; do sleep 1; done
      # On the ports the app connects to by default.
      - name: Start zbugs' backend
        env:
          ZBUGS_PG: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          node apps/zbugs-swift/server/server.ts > "$RUNNER_TEMP/zbugs.log" 2>&1 &
          for _ in $(seq 1 300); do
            grep -q '^ready ' "$RUNNER_TEMP/zbugs.log" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/zbugs.log"
          exit 1
      - name: Generate the Xcode project
        working-directory: apps/zbugs-swift/App
        run: brew install xcodegen && xcodegen generate
      - name: Take screenshots
        working-directory: apps/zbugs-swift/App
        run: |
          TEST_RUNNER_ZBUGS_TOKEN="$(grep '^token ' "$RUNNER_TEMP/zbugs.log" | cut -d' ' -f2)"
          export TEST_RUNNER_ZBUGS_TOKEN
          device="$(xcrun simctl list devices available -j |
            python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')"
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          xcodebuild test -project ZBugs.xcodeproj -scheme ZBugsApp \
            -destination "id=$device" -resultBundlePath "$RUNNER_TEMP/screenshots.xcresult" \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      # With the client's log (os.Logger, subsystem zero).
      - name: Export screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/screenshots.xcresult" --output-path "$RUNNER_TEMP/screenshots"
          xcrun simctl spawn "$DEVICE" log show --last 1h --info --style compact \
            --predicate 'subsystem == "zero"' > "$RUNNER_TEMP/screenshots/client.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zbugs-screenshots
          path: ${{ runner.temp }}/screenshots
      - name: Server logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/zbugs.log"
          cat "$RUNNER_TEMP/pg.log" || true
