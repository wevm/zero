name: Swift Release

# Releases the version in swift/VERSION:
# - Publishes swift/ to the SwiftPM mirror (wevm/zero-swift) and tags the
#   version there. SwiftPM needs Package.swift at a repository root and clones
#   whole repositories, so consumers install from the mirror, not this monorepo.
# - Publishes the zero-swift CLI (packages/zero-swift-cli) to npm with trusted
#   publishing. Its version must match swift/VERSION.
#
# The swift-release environment requires approval. The mirror job is skipped
# until the ZERO_SWIFT_MIRROR_TOKEN secret (push access to the mirror) exists,
# and the npm jobs until the ZERO_SWIFT_NPM_PUBLISH variable is 'true'.

on:
  push:
    branches: [main]
    paths: ['swift/VERSION']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Publish mirror
    runs-on: ubuntu-latest
    environment: swift-release
    env:
      MIRROR_TOKEN: ${{ secrets.ZERO_SWIFT_MIRROR_TOKEN }}
      MIRROR_REPO: wevm/zero-swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Split and push
        if: env.MIRROR_TOKEN != ''
        run: |
          version="$(tr -d '[:space:]' < swift/VERSION)"
          git subtree split --prefix=swift -b mirror
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git"
          git push "$remote" mirror:main
          if git ls-remote --exit-code --tags "$remote" "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists on the mirror; not retagging."
          else
            git tag "$version" mirror
            git push "$remote" "refs/tags/$version"
          fi

  npm-build:
    name: Build npm package
    runs-on: ubuntu-latest
    if: vars.ZERO_SWIFT_NPM_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check the version matches swift/VERSION
        run: |
          version="$(tr -d '[:space:]' < swift/VERSION)"
          package="$(node -p "require('./packages/zero-swift-cli/package.json').version")"
          if [ "$package" != "$version" ]; then
            echo "packages/zero-swift-cli is $package but swift/VERSION is $version." >&2
            exit 1
          fi
      - name: Build and pack
        run: |
          pnpm --filter zero-swift build
          pnpm --filter zero-swift pack --pack-destination "$GITHUB_WORKSPACE/dist/npm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zero-swift-npm
          path: dist/npm/*.tgz
          if-no-files-found: error

  npm-publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs: [mirror, npm-build]
    environment: swift-release
    permissions:
      contents: read
      id-token: write # For npm trusted publishing.
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zero-swift-npm
          path: dist/npm
      - name: Publish
        run: |
          set -euo pipefail
          tarball="$(ls dist/npm/zero-swift-*.tgz)"
          version="${tarball##*/zero-swift-}"
          version="${version%.tgz}"
          if npm view "zero-swift@$version" version >/dev/null 2>&1; then
            echo "zero-swift@$version is already on npm; not republishing."
          else
            npm publish "$tarball" --provenance --access public
          fi
