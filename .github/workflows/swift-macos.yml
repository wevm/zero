name: Swift (macOS)

# The Apple-only layer (ZeroUI, the URLSession transport) and iOS simulator
# tests. Path-filtered because macOS runners are slow to start.

on:
  push:
    # swift-client is the development branch until the client lands on main.
    branches: [main, swift-client]
    paths:
      - 'swift/**'
      - 'packages/zero-conformance/**'
      - 'apps/zbugs-swift/**'
      - '.github/workflows/swift-macos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'swift/**'
      - 'packages/zero-conformance/**'
      - 'apps/zbugs-swift/**'
      - '.github/workflows/swift-macos.yml'

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos:
    name: Swift (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: swift --version
      - name: Build and test (macOS)
        run: swift test
      - name: Docs
        run: scripts/docs.sh

  # The Apple-only API, which Linux doesn't build. See swift.yml.
  api-breaks:
    name: Swift API breaks (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Find the baseline
        id: baseline
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/wevm/zero-swift.git |
            sed 's|.*refs/tags/||' | sort -V | tail -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "swift=$(swift --version 2>&1 | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # The baseline's API dumps, which only change with a release or Xcode.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: api-baseline
          key: swift-api-baseline-macos-${{ steps.baseline.outputs.swift }}-${{ steps.baseline.outputs.tag }}
      - name: API breaks
        env:
          BASELINE: ${{ steps.baseline.outputs.tag }}
        run: |
          API_BREAKS_BASELINE_DIR="$GITHUB_WORKSPACE/api-baseline" \
            scripts/api-breaks.sh "$BASELINE"

  ios:
    name: Swift (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test (iOS Simulator)
        run: |
          device="$(xcrun simctl list devices available -j |
            python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')"
          xcodebuild test -scheme Zero-Package -destination "id=$device" -skipPackagePluginValidation

  zbugs:
    name: zbugs app (iOS and macOS)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/zbugs-swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The drift test again, and ZBugsUI (empty on Linux) for macOS.
      - name: Build and test (macOS)
        run: swift test
      - name: Generate the Xcode project
        working-directory: apps/zbugs-swift/App
        run: brew install xcodegen && xcodegen generate
      - name: Build the app (iOS Simulator)
        working-directory: apps/zbugs-swift/App
        run: >-
          xcodebuild build -project ZBugs.xcodeproj -scheme ZBugsApp
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: Build the app (macOS)
        working-directory: apps/zbugs-swift/App
        run: >-
          xcodebuild build -project ZBugs.xcodeproj -scheme ZBugsApp
          -destination 'generic/platform=macOS'
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
